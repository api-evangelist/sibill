        status:
          description: 'Current internal document status. This field is a mix of status that reflects the document''s progress, both in Sibill and the target tax authority service.

            For the Italian market the tax authority service is SDI.


            Possible values are:


            - `DRAFT`: The document in draft state. In this state the document is not yet finalized.

            - `CREATED`: The document is finalized. If the document is marked as an electronic invoice, it is sent to the target tax authority service.

            - `SENT`: The document is successfully transmitted to the target tax authority service.

            - `DELIVERED`: The document is transmitted to the tax authority service and successfully delivered to the recipient.

            - `NOT_DELIVERED`: The document is successfully transmitted to the target tax authority service butnot delivered to the recipient.

            - `DISCARDED`: The document is discarded. This typically happens when the document is not valid for the target tax authority service.

            - `REFUSED`: The document is refused. This typically happens for Public Administration entities only. It means that the document is not accepted by the recipient.

            '
          enum:
