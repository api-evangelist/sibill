          description: 'The payment method.


            Possible values are:

            - `CARD`: Payment by debit or credit card.

            - `CASH`: Payment in cash.

            - `CHECK`: Payment by bank check.

            - `DEFERRED`: Amount not collected at the time of sale (e.g. ticket, corrispettivo).

            - `TAX_FORM`: Payment via tax withholding form (e.g. F24 ritenute d''acconto).

            - `FISCAL_CREDIT`: Payment offset by a fiscal/tax credit.

            - `OTHER`: Any payment method not covered by the other values.

            - `POSTAL`: Payment via postal order or postal current account (bollettino postale).

            - `RIBA`: Ricevuta Bancaria — Italian bank receipt collection instrument.

            - `SDD`: SEPA Direct Debit — recurring bank debit authorised by the payer.

            - `TRANSFER`: Bank wire transfer (bonifico bancario).

            '
          enum:
          - CARD
          - CASH
          - CHECK
          - DEFERRED
          - TAX_FORM
          - FISCAL_CREDIT
          - OTHER
          - POSTAL
          - RIBA
          - SDD
          - TRANSFER
          nullable: true
          readOnly: true
          type: string
        payment_status:
          description: 'The payment status.


            Possible values are:

            - `PAID`: The flow has been paid.

            - `TO_PAY`: The flow is to be paid.

            '
          enum:
          - PAID
          - TO_PAY
          readOnly: true
          type: string
      title: FlowSchema
      type: object
    InvoiceData:
      description: Invoice data object
      properties:
        data:
          properties:
            invoice:
              $ref: '#/components/schemas/Invoice'
            xml_url:
              description: Signed url for XML representation of the invoice. This field is available as soon as the invoice is sent to the SDI. This URL is valid for a limited time and should be used promptly. Please note that the URL will expire after a certain period of time, so it is recommended to download the XML file as soon as possible.
              nullable: true
              readOnly: true
              type: string
          type: object
      title: InvoiceData
      type: object
  securitySchemes:
    authorization:
      description: Sibill Integration API scheme documentation
      scheme: bearer
      type: https
