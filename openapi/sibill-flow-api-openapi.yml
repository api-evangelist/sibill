components:
  schemas:
    Page:
      properties:
        cursor:
          description: A cursor that can be used to fetch the next page of results
          nullable: true
          type: string
        size:
          description: The current page size
          type: integer
      title: Page
      type: object
    FlowCreate:
      description: Create flow data object
      properties:
        account_id:
          description: The id of the account
          example: 019f8035-d770-7a49-a7e9-5e4c20a3381a
          format: uuid
          nullable: true
