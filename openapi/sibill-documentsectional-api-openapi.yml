components:
  schemas:
    Page:
      properties:
        cursor:
          description: A cursor that can be used to fetch the next page of results
          nullable: true
          type: string
        size:
          description: The current page size
          type: integer
      title: Page
      type: object
    DocumentSectionalSchema:
      description: Document sectional data representation
      properties:
        id:
          description: The id of the document sectional
          example: 019f8035-9c88-742f-bfa2-a41a9d0c33cf
          format: uuid
          readOnly: true
          type: string
        minimum_digits:
          description: The minimum number of digits used to pad the progressive number
          nullable: true
          readOnly: true
          type: integer
        prefix:
          description: The prefix prepended to the progressive number to form the document number
          example: NC/
          nullable: true
          readOnly: true
          type: string
        suffix:
          description: The suffix appended to the progressive number to form the document number
          example: /2026
          nullable: true
          readOnly: true
          type: string
        year:
          description: The year the sectional applies to
          example: 2026
          readOnly: true
          type: integer
      title: DocumentSectionalSchema
      type: object
    DocumentSectionalList:
      description: List of document sectional representations
      properties:
        data:
          items:
            $ref: '#/components/schemas/DocumentSectionalSchema'
          type: array
        page:
          $ref: '#/components/schemas/Page'
      title: DocumentSectionalList
      type: object
    IntegrationError:
      properties:
        errors:
          description: The list of errors encountered during the operation with detailed information
          items:
            properties:
              code:
                description: Short code identifying an error type
                example: bad_request
                type: string
              detail:
                description: The message detail that describes the error
                example: null value where string expected
                nullable: true
                type: string
              source:
                nullable: true
                properties:
                  pointer:
                    description: The exact position in the request where the error occurred
                    example: /data/attributes/name
                    type: string
                type: object
              title:
                description: The message title that describes the error. It is a short, human-readable summary of the problem
                example: Invalid value
                type: string
            type: object
          type: array
      required:
      - errors
      title: IntegrationError
      type: object
    DocumentSectionalCreate:
      description: Create document sectional data object
      properties:
        minimum_digits:
          description: The minimum number of digits used to pad the progressive number
          nullable: true
          type: integer
        prefix:
          description: The prefix prepended to the progressive number to form the document number. Either `prefix` or `suffix` must be provided.
          nullable: true
          type: string
        suffix:
          description: The suffix appended to the progressive number to form the document number. Either `prefix` or `suffix` must be provided.
          nullable: true
          type: string
        year:
          description: The year the sectional applies to
          type: integer
      required:
      - year
      title: DocumentSectionalCreate
      type: object
    DocumentSectionalData:
      description: Document sectional data object
      properties:
        data:
          $ref: '#/components/schemas/DocumentSectionalSchema'
      title: DocumentSectionalData
      type: object
    DocumentSectionalUpdate:
      description: Update document sectional data object
      properties:
        minimum_digits:
          description: The minimum number of digits used to pad the progressive number
          nullable: true
          type: integer
        prefix:
          description: The prefix prepended to the progressive number to form the document number
          nullable: true
          type: string
        suffix:
          description: The suffix appended to the progressive number to form the document number
          nullable: true
          type: string
        year:
          description: The year the sectional applies to
          type: integer
      title: DocumentSectionalUpdate
      type: object
  securitySchemes:
    authorization:
      description: Sibill Integration API scheme documentation
      scheme: bearer
      type: https
