components:
  schemas:
    Page:
      properties:
        cursor:
          description: A cursor that can be used to fetch the next page of results
          nullable: true
          type: string
        size:
          description: The current page size
          type: integer
      title: Page
      type: object
    CounterpartCreate:
      description: Create counterpart data object
      properties:
        address:
          description: The address
          nullable: true
          type: string
        city:
          description: The city
          nullable: true
          type: string
        company_name:
          description: The company name of the counterpart
          nullable: true
          type: string
        country:
          description: The country (ISO code)
          type: string
        destination_code:
          description: The destination code (if applicable) for the Italian Electronic system (SDI).
          nullable: true
          type: string
        identity_type:
          description: 'The type of the counterpart.


            Possible values are:

            - `COMPANY`: a company

            - `PA`: a public authority

            - `PERSON`: a person

            - `CONTRACTOR`: a contractor

            '
          enum:
          - COMPANY
          - PA
          - PERSON
          - CONTRACTOR
          nullable: true
          type: string
        postal_code:
          description: The postal code (if applicable)
          nullable: true
          type: string
        province_code:
          description: The province code (if applicable)
          nullable: true
          type: string
        tax_number:
          description: The tax number
          nullable: true
          type: string
        vat_number:
          description: The VAT number
          nullable: true
          type: string
      required:
      - country
      title: CounterpartCreate
      type: object
    CounterpartData:
      description: Counterpart data representation
      properties:
        data:
          $ref: '#/components/schemas/CounterpartSchema'
      title: CounterpartData
      type: object
    CounterpartUpdate:
      description: Update counterpart data object
      properties:
        address:
          description: The address
          nullable: true
          type: string
        city:
          description: The city
          nullable: true
          type: string
        company_name:
          description: The company name of the counterpart
          nullable: true
          type: string
        country:
          description: The country (ISO code)
          nullable: true
          type: string
        destination_code:
          description: The destination code (if applicable) for the Italian Electronic system (SDI).
          nullable: true
          type: string
        postal_code:
          description: The postal code (if applicable)
          nullable: true
          type: string
        province_code:
          description: The province code (if applicable)
          nullable: true
          type: string
      title: CounterpartUpdate
      type: object
    CounterpartSearchData:
      description: Counterpart search result representation
