components:
  schemas:
    Page:
      properties:
        cursor:
          description: A cursor that can be used to fetch the next page of results
          nullable: true
          type: string
        size:
          description: The current page size
          type: integer
      title: Page
      type: object
    ProductSchema:
      description: Product data representation
      properties:
        code:
          description: The internal code that identifies the product
          nullable: true
          readOnly: true
          type: string
        description:
          description: The description of the product
          readOnly: true
          type: string
        id:
          description: The id of the product
          example: 019f8035-9d35-75c4-a2e2-79fcab6703c5
          format: uuid
          readOnly: true
          type: string
        tax_exemption:
          description: The tax exemption code, required when `vat_percentage` is `0`
          nullable: true
          readOnly: true
          type: string
        unit_of_measure:
          description: The unit of measure of the product (e.g. `pcs`, `kg`, `h`)
          nullable: true
          readOnly: true
          type: string
        unit_price:
          description: Money representation through amount and currency properties
          example:
            amount: '12.3'
            currency: EUR
          properties:
            amount:
              minLength: 1
              pattern: ^[0-9]*\.?[0-9]+$
              readOnly: true
              type: string
            currency:
              enum:
              - AED
              - AFN
              - ALL
              - AMD
              - ANG
              - AOA
              - ARS
