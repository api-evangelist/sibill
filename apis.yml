aid: sibill
name: Sibill
description: >-
  Sibill is an Italian fintech platform that centralizes financial and administrative
  management for small and medium-sized businesses (PMI). It unifies electronic
  invoicing (submitted to the Agenzia delle Entrate SDI), treasury and cash-flow
  monitoring, payments, business accounts and debit cards, and AI-assisted
  reconciliation of bank transactions against invoices and deadlines. The Sibill
  Integration API exposes companies, bank accounts, categories, counterparts,
  documents, payment flows, reconciliations, products and transactions over a REST
  interface secured with Bearer API keys, with cursor pagination, field expansion,
  and Document/Flow webhooks. Backed by Creandum.
